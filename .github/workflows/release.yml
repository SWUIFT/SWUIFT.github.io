name: Publish tagged release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to publish"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PYTHON_VERSION: "3.10"
  EXPECTED_SIGNING_IDENTITY: >-
    https://github.com/SWUIFT/SWUIFT.github.io/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install release tools
        run: python -m pip install --upgrade pip -r requirements-build.txt

      - name: Resolve and validate release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/check_public_boundary.py
          python scripts/check_release_metadata.py --tag "$REQUESTED_TAG"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        run: |
          python -m build --outdir dist/core packages/core
          python -m build --outdir dist/cli packages/cli
          python -m twine check dist/core/* dist/cli/*

      - name: Generate and verify SHA-256 manifest
        run: |
          python scripts/generate_sha256_manifest.py dist
          python scripts/verify_sha256_manifest.py dist/SHA256SUMS \
            --strict-directory dist

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/core/*
            dist/cli/*
            dist/SHA256SUMS

      - name: Sign release files with GitHub OIDC
        shell: bash
        run: |
          for artifact in dist/core/* dist/cli/* dist/SHA256SUMS; do
            python -m sigstore sign \
              --bundle "${artifact}.sigstore.json" \
              "$artifact"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/core/* dist/cli/* dist/SHA256SUMS* \
            --verify-tag \
            --generate-notes \
            --title "SWUIFT $RELEASE_TAG"

      - name: Report Zenodo deposition placeholder
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          if [ -n "$ZENODO_ACCESS_TOKEN" ]; then
            echo "ZENODO_ACCESS_TOKEN is configured."
            echo "Add a reviewed Zenodo deposition step after assigning the repository DOI."
          else
            echo "Zenodo publication skipped: configure the ZENODO_ACCESS_TOKEN secret."
          fi
          echo "Do not add a DOI to metadata until Zenodo assigns it."
