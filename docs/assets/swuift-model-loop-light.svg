<svg xmlns="http://www.w3.org/2000/svg" id="swml-l" width="1800" height="800" viewBox="0 0 1800 800" role="img" aria-labelledby="swml-l-t swml-l-d"><title id="swml-l-t">The SWUIFT simulation loop</title><desc id="swml-l-d">Ignition activates structure and vegetation cells, which advance through burn states and emit radiation and firebrands; accumulated energy and firebrands past their thresholds ignite further cells.</desc>
<style>#swml-l text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Carlito,Helvetica,Arial,sans-serif}#swml-l .swml-l-big{font-size:36px;font-weight:700;fill:#2C2C2A}#swml-l .swml-l-sub{font-size:17px;font-weight:400;fill:#5F5E5A}#swml-l .swml-l-col{font-size:24px;font-weight:600;fill:#2C2C2A}#swml-l .swml-l-lane{font-size:19px;font-weight:600;fill:#444441}#swml-l .swml-l-pill{font-size:17px;font-weight:600}#swml-l .swml-l-item{font-size:16px;font-weight:600;fill:#2C2C2A}#swml-l .swml-l-cond{font-size:15px;font-weight:500}#swml-l .swml-l-note{font-size:14px;font-weight:400;fill:#888780}#swml-l .swml-l-ft{font-size:15px;font-weight:400;fill:#888780}#swml-l .swml-l-card{fill:#FFFFFF;stroke:#D3D1C7;stroke-width:1.2}#swml-l .swml-l-pnl{fill:#F7F5F0;stroke:#D3D1C7;stroke-width:1.2}#swml-l .swml-l-box{fill:#FFFFFF;stroke:#C6C3B8;stroke-width:1.4}#swml-l .swml-l-dash{fill:none;stroke:#B4B2A9;stroke-width:1.6;stroke-dasharray:7 6}#swml-l .swml-l-ln{stroke:#888780;stroke-width:1.7;fill:none;stroke-linejoin:round;stroke-linecap:round}#swml-l .swml-l-ah{stroke:#888780;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}#swml-l .swml-l-chev{fill:#C6C3B8}#swml-l .swml-l-hot{fill:#D85A30}#swml-l .swml-l-rA{fill:#FAEEDA;stroke:#BA7517;stroke-width:1.3}#swml-l .swml-l-xA{fill:#633806}#swml-l .swml-l-rC{fill:#FAECE7;stroke:#D85A30;stroke-width:1.3}#swml-l .swml-l-xC{fill:#712B13}#swml-l .swml-l-rB{fill:#E8F1FC;stroke:#3A6FBF;stroke-width:1.3}#swml-l .swml-l-xB{fill:#1E4478}#swml-l .swml-l-rP{fill:#FBECF1;stroke:#D4537E;stroke-width:1.3}#swml-l .swml-l-xP{fill:#72243E}#swml-l .swml-l-rU{fill:#EEEDFE;stroke:#7F77DD;stroke-width:1.3}#swml-l .swml-l-xU{fill:#3C3489}#swml-l .swml-l-ink{fill:#0F6E56}#swml-l .swml-l-ink2{fill:#534AB7}
</style>
