[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swuift-core"
version = "1.0.4"
description = "Shared SWUIFT physics core (kernels, spread, hardening)"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-SWUIFT-Research-Academic-Use"
license-files = ["LICENSE"]
dependencies = [
  "numpy",
  "numba",
  "scipy",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# Repository and issue-tracker URLs must be added here before publication.
# LICENSE is an exact package copy of the authoritative ../../LICENSE.

[tool.setuptools.packages.find]
where = ["src"]
include = ["swuift_core*"]
